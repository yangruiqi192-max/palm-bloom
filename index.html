<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>掌心花开</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:#10151a;color:#f7e9ed;
font-family:system-ui,"Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;inset:0;
background:radial-gradient(ellipse at 50% 43%,#34202e66,transparent 60%);
pointer-events:none}
#scene{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;top:32px;left:36px;pointer-events:none}
small{color:#bba6a8;letter-spacing:5px;font-size:11px}
h1{font-weight:400;font-size:38px;letter-spacing:8px;margin:12px 0}
header p{color:#b5adb3;font-size:13px;line-height:1.8}
.panel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
width:min(480px,calc(100% - 32px));padding:18px 22px;border:1px solid #ffffff15;
border-radius:20px;background:#171b22df;backdrop-filter:blur(18px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
button{font:inherit;cursor:pointer;border:1px solid #ffffff25;border-radius:11px;
padding:10px 16px;background:#ffffff09;color:#eee;font-size:13px}
button:hover{background:#ffffff18}
button:disabled{opacity:.5;cursor:wait}
#camera{background:#efb9ca;color:#2a1922;border:0;font-weight:600}
#percent{font-variant-numeric:tabular-nums;color:#f3c4d3;font-size:25px}
input[type=range]{width:100%;accent-color:#efb9ca;margin:14px 0 4px}
.labels{display:flex;justify-content:space-between;color:#a79aa4;font-size:11px}
#status{font-size:12px;line-height:1.7;color:#d4c3cf;min-height:21px;margin-top:13px}
.note{font-size:10px;color:#8d8791;margin:8px 0 0}
#calibration{display:flex;gap:8px;margin-top:10px}
#calibration button{font-size:11px;padding:7px 11px}
#preview{position:fixed;right:24px;top:24px;width:240px;aspect-ratio:4/3;
border-radius:16px;overflow:hidden;border:1px solid #ffffff22;background:#080c12}
#video,#bones{position:absolute;inset:0;width:100%;height:100%;
transform:scaleX(-1);object-fit:fill}
#preview span{position:absolute;bottom:8px;left:10px;font-size:10px;
background:#0009;padding:4px 8px;border-radius:5px}
@media(max-width:600px){
 header{top:20px;left:24px}h1{font-size:30px}
 #preview{top:132px;right:16px;width:144px}
 .panel{bottom:16px;padding:14px 18px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<header>
  <small>PALM BLOOM</small>
  <h1>掌心花开</h1>
  <p>缓缓张开手掌，让一朵花为你盛放。<br>握拳收拢 · 张掌绽放</p>
</header>
<div id="preview" hidden>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="bones" width="320" height="240"></canvas>
  <span>本地手部识别</span>
</div>
<div class="panel">
  <div class="row">
    <button id="camera">开启摄像头</button>
    <span id="percent">65%</span>
  </div>
  <input id="amount" aria-label="花朵开放程度"
         type="range" min="0" max="100" value="65">
  <div class="labels"><span>收拢</span><span>手动预览 / 摄像头识别</span><span>盛放</span></div>
  <div id="status" role="status">手动预览 · 拖动滑杆让花朵绽放</div>
  <div id="calibration" hidden>
    <button id="closed">握拳后点此校准</button>
    <button id="opened">张掌后点此校准</button>
  </div>
  <p class="note">摄像头画面仅在本机处理，不上传。首次加载模型需要联网。</p>
</div>
<script>
const $=id=>document.getElementById(id), c=$('scene'), g=c.getContext('2d');
const video=$('video'), overlay=$('bones'), bg=overlay.getContext('2d');
let W=0,H=0,target=.65,bloom=.65,manual=.65,active=false,starting=false;
let model=null,stream=null,lastDetect=0,lastVideo=-1,lastSeen=0,points=null;
let raw=.8,low=.46,high=.94,previous=0;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

function resize(){
  W=innerWidth;H=innerHeight;
  let d=Math.min(devicePixelRatio||1,2);
  c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);resize();

const particles=Array.from({length:65},()=>({
  x:Math.random(),y:Math.random(),
  s:Math.random()*1.6+.3,v:Math.random()*.018+.005
}));

function project(x,y,z){
  const depth=y*.84+z*.54,k=650/(650-depth);
  return {x:x*k,y:(y*.54-z*.84)*k,d:depth};
}

function petal(a,t,u,layer,open){
  const L=150-layer*20,angle=.12+open*(1.40-layer*.10);
  const r=8+layer*1.5+L*(Math.sin(angle)*t+.16*open*Math.sin(Math.PI*t));
  const z=L*(Math.cos(angle)*t+.20*open*Math.sin(Math.PI*t)
    -.23*open*t*t*t)+layer*5;
  const width=(35-layer*4)*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.72)
    *(.36+.64*open);
  return project(
    Math.cos(a)*r-Math.sin(a)*u*width,
    Math.sin(a)*r+Math.cos(a)*u*width,
    z-u*u*8*Math.sin(Math.PI*t)
  );
}

function drawFlower(time){
  const size=Math.min(W*.0028,H*.00165,1.5);
  g.save();
  g.translate(W*.5,H*.45+20+Math.sin(time*.00065)*3);
  g.scale(size,size);
  const aura=g.createRadialGradient(0,-35,0,0,-35,220);
  aura.addColorStop(0,'rgba(227,104,161,'+(.04+bloom*.09)+')');
  aura.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=aura;g.fillRect(-240,-260,480,480);

  g.strokeStyle='#4c7763';g.lineWidth=3;
  g.beginPath();g.moveTo(0,8);
  g.bezierCurveTo(-9,80,20,130,3,210);g.stroke();

  for(const side of [-1,1]){
    g.save();g.translate(4,side<0?105:155);g.scale(side,1);
    g.beginPath();g.moveTo(0,0);
    g.bezierCurveTo(30,-42,61,-25,70,-45);
    g.bezierCurveTo(58,-3,19,7,0,0);
    g.fillStyle='#294e41';g.fill();
    g.strokeStyle='#678d64';g.lineWidth=.6;
    g.beginPath();g.moveTo(0,0);
    g.quadraticCurveTo(31,-17,65,-41);g.stroke();g.restore();
  }

  const petals=[];
  for(let layer=0;layer<4;layer++){
    let count=11-layer*2;
    const o=clamp((bloom-layer*.055)/(1-layer*.055));
    for(let n=0;n<count;n++){
      const a=n/count*Math.PI*2+layer*.53+Math.sin(time*.0002)*.035;
      petals.push({a,layer,o,d:petal(a,.55,0,layer,o).d});
    }
  }
  petals.sort((a,b)=>a.d-b.d);

  for(const p of petals){
    const base=petal(p.a,0,0,p.layer,p.o);
    const tip=petal(p.a,1,0,p.layer,p.o);
    const grad=g.createLinearGradient(base.x,base.y,tip.x,tip.y);
    const light=clamp((Math.sin(p.a)+1)/2);
    grad.addColorStop(0,'hsl(337 55% '+(28+light*9)+'%)');
    grad.addColorStop(.42,'hsl(339 65% '+(58+light*12)+'%)');
    grad.addColorStop(1,'hsl(350 75% '+(85+light*10)+'%)');

    g.beginPath();
    for(const side of [-1,1]){
      for(let j=0;j<=28;j++){
        const t=side<0?j/28:1-j/28;
        const q=petal(p.a,t,side,p.layer,p.o);
        if(side<0&&j===0)g.moveTo(q.x,q.y);
        else g.lineTo(q.x,q.y);
      }
    }
    g.closePath();g.fillStyle=grad;g.fill();
    g.strokeStyle='rgba(255,210,227,.23)';g.lineWidth=.55;g.stroke();

    for(const u of [-.45,0,.45]){
      g.beginPath();
      for(let j=1;j<27;j++){
        let q=petal(p.a,j/28,u,p.layer,p.o);
        if(j===1)g.moveTo(q.x,q.y);else g.lineTo(q.x,q.y);
      }
      g.strokeStyle='rgba(255,230,238,.10)';g.lineWidth=.45;g.stroke();
    }
  }

  if(bloom>.45){
    g.globalAlpha=clamp((bloom-.45)*3);
    for(let i=0;i<24;i++){
      const a=i*2.4,r=3+Math.sqrt(i)*1.9;
      const p=project(Math.cos(a)*r,Math.sin(a)*r,14);
      g.beginPath();g.arc(p.x,p.y,1.6,0,Math.PI*2);
      g.fillStyle=i%2?'#e9ba66':'#fff0bb';g.fill();
    }
  }
  g.restore();
}

function drawBones(){
  bg.clearRect(0,0,320,240);if(!points)return;
  const lines=[
    [0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],
    [9,13,14,15,16],[13,17,18,19,20],[0,17]
  ];
  bg.strokeStyle='#b1f3c8';bg.lineWidth=2;
  for(const path of lines){
    bg.beginPath();
    path.forEach((i,k)=>{
      const p=points[i];
      k?bg.lineTo(p.x*320,p.y*240):bg.moveTo(p.x*320,p.y*240);
    });
    bg.stroke();
  }
  bg.fillStyle='#fff';
  for(const p of points){
    bg.beginPath();bg.arc(p.x*320,p.y*240,2.5,0,Math.PI*2);bg.fill();
  }
}

// 指根至指尖的直线距离 / 骨节总长度：对手部尺寸和旋转不敏感。
function openness(p){
  const d=(a,b)=>Math.hypot(
    p[a].x-p[b].x,p[a].y-p[b].y,p[a].z-p[b].z
  );
  return [5,9,13,17].reduce((sum,i)=>
    sum+d(i,i+3)/Math.max(1e-6,
      d(i,i+1)+d(i+1,i+2)+d(i+2,i+3)),0)/4;
}

function status(s){$('status').textContent=s;}

function stop(){
  active=false;
  stream?.getTracks().forEach(t=>t.stop());
  stream=null;video.pause();video.srcObject=null;
  points=null;lastVideo=-1;
  $('camera').textContent='开启摄像头';
  $('preview').hidden=true;$('calibration').hidden=true;
  $('amount').value=manual*100;target=manual;
  status('手动预览 · 拖动滑杆让花朵绽放');drawBones();
}

$('camera').onclick=async()=>{
  if(active){stop();return;}
  if(starting)return;
  starting=true;$('camera').disabled=true;
  status('正在开启摄像头…');
  try{
    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error('请使用 Chrome/Edge 打开本文件，或通过 HTTPS / localhost 访问。');

    stream=await navigator.mediaDevices.getUserMedia({
      video:{width:640,height:480,facingMode:'user'},audio:false
    });
    video.srcObject=stream;await video.play();
    status('正在加载手部识别模型，首次需要联网…');

    if(!model){
      const {HandLandmarker,FilesetResolver}=await import(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
      );
      const files=await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      const options={
        baseOptions:{
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate:'GPU'
        },
        runningMode:'VIDEO',numHands:1,
        minHandDetectionConfidence:.6,
        minHandPresenceConfidence:.6,
        minTrackingConfidence:.6
      };
      try{
        model=await HandLandmarker.createFromOptions(files,options);
      }catch{
        options.baseOptions.delegate='CPU';
        model=await HandLandmarker.createFromOptions(files,options);
      }
    }
    active=true;lastSeen=performance.now();
    $('camera').textContent='关闭摄像头';
    $('preview').hidden=false;$('calibration').hidden=false;
    status('请将一只手放进镜头 · 握拳收拢，张掌绽放');
  }catch(e){
    stop();
    status(
      e.name==='NotAllowedError'
      ?'摄像头未获授权，请允许后重试；也可以继续使用滑杆。'
      :e.name==='NotFoundError'
      ?'没有找到摄像头，可以使用滑杆体验。'
      :'启动失败：'+e.message+' 可继续使用滑杆。'
    );
  }finally{
    starting=false;$('camera').disabled=false;
  }
};

$('amount').oninput=e=>{
  manual=+e.target.value/100;
  if(!active)target=manual;
};

$('closed').onclick=()=>{
  if(!points){status('先将握紧的拳头放进镜头，再点校准。');return;}
  if(raw>high-.12){status('请先握紧拳头再校准。');return;}
  low=raw;status('握拳已校准，现在张开手掌。');
};

$('opened').onclick=()=>{
  if(!points){status('先将张开的手掌放进镜头，再点校准。');return;}
  if(raw<low+.12){status('请将手指充分伸直后再校准。');return;}
  high=raw;status('张掌已校准，试着慢慢开合手掌。');
};

addEventListener('pagehide',()=>{
  stream?.getTracks().forEach(t=>t.stop());
});

function frame(time){
  const dt=Math.min(.05,Math.max(0,(time-previous)/1000));previous=time;

  if(active&&video.readyState>=2&&
     video.currentTime!==lastVideo&&time-lastDetect>50){
    lastDetect=time;lastVideo=video.currentTime;
    try{
      const result=model.detectForVideo(video,time);
      points=result.landmarks[0]||null;
      if(points){
        lastSeen=time;
        raw=openness(result.worldLandmarks?.[0]||points);
        target=clamp((raw-low)/Math.max(.12,high-low));
        status('正在识别 · '+(
          target<.15?'握拳 / 花苞':
          target>.85?'张掌 / 盛放':'缓慢绽放中'
        ));
      }else if(time-lastSeen>800){
        target=.06;status('未检测到手 · 将一只手放进镜头');
      }
      drawBones();
    }catch(e){
      stop();status('识别中断，请重新开启摄像头；滑杆仍可使用。');
    }
  }

  bloom+=(target-bloom)*(1-Math.exp(-dt*8));
  $('percent').textContent=Math.round(bloom*100)+'%';
  if(active)$('amount').value=Math.round(bloom*100);
  g.clearRect(0,0,W,H);

  for(const p of particles){
    p.y-=p.v*dt*(.3+bloom);if(p.y<0)p.y=1;
    g.globalAlpha=.18+bloom*.32;g.fillStyle='#f5d1a1';
    g.beginPath();
    g.arc(p.x*W+Math.sin(time*.0004+p.x*9)*12,p.y*H,p.s,0,Math.PI*2);
    g.fill();
  }
  g.globalAlpha=1;drawFlower(time);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
