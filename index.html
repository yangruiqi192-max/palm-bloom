<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>掌心花开 · 粒子版 V5</title>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#080b14;color:#f7e9ed;
  font-family:system-ui,"Microsoft YaHei",sans-serif
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(
    ellipse at 50% 40%,#39204644,transparent 65%
  )
}
#scene{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none
}
header{
  position:fixed;
  top:max(20px,env(safe-area-inset-top));
  left:24px;pointer-events:none
}
small{font-size:10px;letter-spacing:4px;color:#bba6bc}
h1{
  font-size:30px;font-weight:400;
  letter-spacing:6px;margin:12px 0
}
header p{font-size:12px;color:#b4aabd;line-height:1.8}
.panel{
  position:fixed;
  bottom:max(12px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  width:min(480px,calc(100% - 28px));
  max-height:43%;overflow:auto;
  padding:14px 18px;
  border:1px solid #ffffff20;
  border-radius:18px;
  background:#141722ed;
  backdrop-filter:blur(12px)
}
.row{display:flex;align-items:center;gap:8px}
button{
  font:inherit;font-size:12px;cursor:pointer;
  padding:10px 12px;
  border:1px solid #ffffff25;border-radius:10px;
  background:#ffffff09;color:#eee;min-height:40px
}
button:disabled{opacity:.5;cursor:wait}
#camera{
  background:#eab7dc;color:#241529;
  border:0;font-weight:600
}
#percent{
  margin-left:auto;font-size:24px;color:#efc1e7;
  font-variant-numeric:tabular-nums
}
input[type=range]{
  width:100%;accent-color:#eab7dc;
  margin:12px 0 2px;min-height:28px
}
.labels{
  display:flex;justify-content:space-between;
  font-size:10px;color:#a69bb0
}
#status{
  font-size:12px;line-height:1.7;
  margin-top:10px;min-height:22px
}
#calibration{
  display:flex;gap:8px;margin-top:8px;flex-wrap:wrap
}
#calibration button{padding:6px 10px;font-size:11px}
.note,#diagnostic{
  font-size:10px;color:#94899e;
  line-height:1.6;margin:8px 0 0
}
#preview{
  position:fixed;right:16px;
  top:max(20px,env(safe-area-inset-top));
  width:220px;aspect-ratio:4/3;
  border-radius:14px;overflow:hidden;
  border:1px solid #ffffff30;background:#000
}
#video,#bones{
  position:absolute;inset:0;width:100%;height:100%;
  transform:scaleX(-1);object-fit:fill
}
#preview span{
  position:absolute;bottom:7px;left:8px;
  font-size:10px;padding:3px 7px;
  background:#0009;border-radius:5px
}
#boot{
  position:fixed;top:40%;left:10%;width:80%;
  font-size:14px;line-height:1.8
}
@media(max-width:600px){
  header{left:22px}
  h1{font-size:27px}
  #preview{top:130px;right:14px;width:150px}
  .panel{padding:12px 16px}
}
@media(max-height:550px){
  header p{display:none}
  #preview{top:16px;width:125px}
  .panel{max-height:40%;width:min(480px,76%)}
}
</style>
</head>

<body>
<canvas id="scene" aria-label="手势控制的粒子花"></canvas>

<header>
  <small>PARTICLE BLOOM · V5</small>
  <h1>掌心花开</h1>
  <p>握拳收拢 · 张掌绽放<br>让星尘在掌心汇成一朵花</p>
</header>

<p id="boot">
  正在打开粒子花。如果一直没有显示，
  请更新浏览器，并确认 JavaScript 已启用。
</p>

<div id="preview" hidden>
  <video id="video" autoplay muted
         playsinline webkit-playsinline></video>
  <canvas id="bones" width="320" height="240"></canvas>
  <span>将完整手掌放进画面</span>
</div>

<section class="panel">
  <div class="row">
    <button id="camera" type="button">开启摄像头</button>
    <button id="flip" type="button">切换后置</button>
    <span id="percent">65%</span>
  </div>

  <input id="amount" type="range"
         min="0" max="100" value="65"
         aria-label="花朵开放程度">

  <div class="labels">
    <span>收拢</span>
    <span>关闭摄像头后可手动调节</span>
    <span>盛放</span>
  </div>

  <div id="status" role="status">
    手动预览 · 拖动滑杆控制粒子花
  </div>

  <div id="calibration" hidden>
    <button id="opened" type="button">① 张掌校准</button>
    <button id="closed" type="button">② 握拳校准</button>
  </div>

  <p id="diagnostic">V5 · 尚未开启识别</p>
  <p class="note">
    先张掌，看到绿色骨骼线后慢慢握拳。校准可选。<br>
    视频仅在本机处理；首次开启识别需要联网下载模型。
  </p>
</section>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const canvas=$('scene');
  const g=canvas.getContext('2d');
  const video=$('video');
  const overlay=$('bones');
  const bg=overlay.getContext('2d');
  const input=document.createElement('canvas');
  const inputCtx=input.getContext('2d');
  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

  let W=0,H=0,bloom=.65,target=.65,manual=.65;
  let engine=null,stream=null;
  let active=false,starting=false,front=true,epoch=0;
  let controller=null,points=null,raw=.8;
  let closed=.46,opened=.94,calibration=null;
  let lastSeen=0,lastVideo=-1,lastInfer=0;
  let lastPaint=0,previous=0,frames=0,hits=0;
  let noticeUntil=0;

  $('boot').hidden=true;

  function status(message,hold=0){
    if(!hold&&performance.now()<noticeUntil)return;
    if(hold)noticeUntil=performance.now()+hold;
    if($('status').textContent!==message){
      $('status').textContent=message;
    }
  }

  function resize(){
    W=innerWidth;
    H=innerHeight;
    const d=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(W*d);
    canvas.height=Math.round(H*d);
    g.setTransform(d,0,0,d,0,0);
  }

  addEventListener('resize',resize);
  resize();

  const particles=Array.from({length:55},()=>({
    x:Math.random(),
    y:Math.random(),
    s:.4+Math.random()*1.2,
    v:.005+Math.random()*.012
  }));

  function project(x,y,z){
    const depth=y*.84+z*.54;
    const k=650/(650-depth);
    return {
      x:x*k,
      y:(y*.54-z*.84)*k,
      d:depth
    };
  }

  function petal(a,t,u,layer,open){
    const L=150-layer*20;
    const angle=.12+open*(1.40-layer*.10);

    const r=8+layer*1.5+
      L*(Math.sin(angle)*t+
      .16*open*Math.sin(Math.PI*t));

    const z=L*(
      Math.cos(angle)*t+
      .20*open*Math.sin(Math.PI*t)-
      .23*open*t*t*t
    )+layer*5;

    const width=(35-layer*4)*
      Math.pow(
        Math.max(0,Math.sin(Math.PI*t)),.72
      )*(.36+.64*open);

    return project(
      Math.cos(a)*r-Math.sin(a)*u*width,
      Math.sin(a)*r+Math.cos(a)*u*width,
      z-u*u*8*Math.sin(Math.PI*t)
    );
  }

  const glowSprites=[
    '255,176,215',
    '237,126,204',
    '177,161,255',
    '255,229,165',
    '127,218,193'
  ].map(rgb=>{
    const sprite=document.createElement('canvas');
    sprite.width=sprite.height=32;
    const s=sprite.getContext('2d');
    const gradient=s.createRadialGradient(
      16,16,0,16,16,16
    );

    gradient.addColorStop(
      0,'rgba(255,255,255,1)'
    );
    gradient.addColorStop(
      .13,'rgba('+rgb+',.95)'
    );
    gradient.addColorStop(
      .36,'rgba('+rgb+',.32)'
    );
    gradient.addColorStop(
      1,'rgba('+rgb+',0)'
    );

    s.fillStyle=gradient;
    s.fillRect(0,0,32,32);
    return sprite;
  });

  let flowerSeed=20261027;

  function randomFlower(){    flowerSeed=(Math.imul(flowerSeed,1664525)+1013904223)>>>0;
    return flowerSeed/4294967296;
  }

  const flowerDust=[];
  for(let layer=0;layer<4;layer++){
    const count=11-layer*2;
    for(let n=0;n<count;n++){
      for(let k=0;k<78;k++){
        flowerDust.push({
          layer,
          a:n/count*Math.PI*2+layer*.53,
          t:randomFlower(),
          u:randomFlower()*2-1,
          s:.55+randomFlower()*.8,
          phase:randomFlower()*Math.PI*2
        });
      }
    }
  }

  function sparkle(x,y,size,color,alpha=1){
    g.globalAlpha=alpha;
    g.drawImage(
      glowSprites[color],
      x-size,y-size,size*2,size*2
    );
  }

  function drawFlower(time){
    const size=Math.min(W*.0028,H*.00165,1.5);
    g.save();
    g.translate(W*.5,H*.45+20);
    g.scale(size,size);
    g.globalCompositeOperation='lighter';
    const t=time*.001;

    for(let i=0;i<140;i++){
      const f=i/139;
      sparkle(
        5*Math.sin(f*3),f*205+8,
        1.4,4,.3+Math.sin(i+t)*.12
      );
    }

    for(const side of [-1,1]){
      for(let i=0;i<110;i++){
        const f=i/109;
        const w=Math.sin(f*Math.PI)*10;
        const j=Math.sin(i*13.1);
        sparkle(
          4+side*f*66,
          118+(side>0?38:0)-f*40+j*w,
          1.45,4,.45
        );
      }
    }

    for(const p of flowerDust){
      const opening=clamp(
        (bloom-p.layer*.055)/(1-p.layer*.055)
      );
      const a=p.a+Math.sin(t*.2)*.035;
      const q=petal(a,p.t,p.u,p.layer,opening);
      const float=clamp((bloom-.82)/.18)*
        Math.max(0,p.t-.65)*9;
      const dx=Math.cos(p.phase+t*.65)*float;
      const dy=Math.sin(p.phase+t*.4)*float;
      const twinkle=.58+.30*Math.sin(p.phase+t*1.5);
      sparkle(
        q.x+dx,q.y+dy,p.s*2.2,
        p.layer===3?0:p.layer,twinkle
      );
    }

    if(bloom>.35){
      for(let i=0;i<85;i++){
        const a=i*2.39996;
        const r=Math.sqrt(i/85)*15;
        const q=project(Math.cos(a)*r,Math.sin(a)*r,14);
        sparkle(
          q.x,q.y,1.8,3,
          clamp((bloom-.35)*2)*(.65+.2*Math.sin(i+t))
        );
      }
    }
    g.restore();
    g.globalAlpha=1;
  }

  function deadline(promise,ms,message,onLate){
    let timer,expired=false;
    const timeout=new Promise((_,reject)=>{
      timer=setTimeout(()=>{
        expired=true;
        reject(new Error(message));
      },ms);
    });
    promise.then(value=>{
      if(expired&&onLate)onLate(value);
    },()=>{});
    return Promise.race([promise,timeout])
      .finally(()=>clearTimeout(timer));
  }

  async function waitVideo(){
    await deadline(
      video.play(),12000,
      '摄像头没有开始播放，请重试'
    );
    await deadline(new Promise(resolve=>{
      function check(){
        if(
          video.readyState>=2&&
          video.videoWidth>0&&video.videoHeight>0
        ){
          resolve();
          return;
        }
        if(!video.srcObject){
          resolve();
          return;
        }
        setTimeout(check,100);
      }
      check();
    }),8000,'摄像头没有提供有效画面，请重新开启');
        }  async function createEngine(signal){
    status('摄像头已开启 · 正在下载手部识别模型…');
    const abort=new AbortController();
    const cancel=()=>abort.abort();

    signal.addEventListener('abort',cancel,{once:true});
    if(signal.aborted)abort.abort();

    const timer=setTimeout(()=>abort.abort(),35000);
    let bytes;

    try{
      const response=await fetch(
        'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        {signal:abort.signal}
      );
      if(!response.ok){
        throw new Error('模型下载失败，HTTP '+response.status);
      }
      bytes=new Uint8Array(await response.arrayBuffer());
      if(bytes.length<1000000){
        throw new Error('模型下载不完整，请重试');
      }
    }finally{
      clearTimeout(timer);
      signal.removeEventListener('abort',cancel);
    }

    const roots=[
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
      'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'
    ];
    let lastError;

    for(let i=0;i<roots.length;i++){
      if(signal.aborted)throw new Error('启动已取消');
      try{
        status(
          i?'正在尝试备用识别库地址…':
          '模型已下载 · 正在加载识别引擎…'
        );
        const module=await deadline(
          import(roots[i]+'/vision_bundle.mjs'),
          18000,'识别库下载超时'
        );
        if(signal.aborted)throw new Error('启动已取消');

        const files=await module.FilesetResolver
          .forVisionTasks(roots[i]+'/wasm');

        const result=await deadline(
          module.HandLandmarker.createFromOptions(files,{
            baseOptions:{
              modelAssetBuffer:bytes,
              delegate:'CPU'
            },
            runningMode:'VIDEO',
            numHands:1,
            minHandDetectionConfidence:.35,
            minHandPresenceConfidence:.35,
            minTrackingConfidence:.35
          }),
          30000,'识别引擎启动超时',
          value=>value.close()
        );

        if(signal.aborted){
          result.close();
          throw new Error('启动已取消');
        }
        return result;
      }catch(error){
        lastError=error;
      }
    }
    throw lastError||new Error('识别引擎启动失败');
  }

  function stopCamera(message){
    epoch++;
    if(controller)controller.abort();
    controller=null;
    if(stream){
      stream.getTracks().forEach(track=>track.stop());
    }
    stream=null;
    active=false;
    starting=false;
    calibration=null;
    points=null;
    video.pause();
    video.srcObject=null;
    lastVideo=-1;

    $('preview').hidden=true;
    $('calibration').hidden=true;
    $('camera').textContent='开启摄像头';
    $('flip').disabled=false;
    $('amount').value=Math.round(manual*100);
    target=manual;

    bg.clearRect(0,0,overlay.width,overlay.height);
    noticeUntil=0;
    status(message||'手动预览 · 拖动滑杆控制粒子花');
  }

  async function startCamera(){
    const id=++epoch;
    const abort=new AbortController();
    controller=abort;
    starting=true;
    noticeUntil=0;

    $('camera').textContent='取消启动';
    $('flip').disabled=true;
    status('正在申请摄像头权限，请点“允许”…');

    try{
      if(!globalThis.isSecureContext){
        throw new Error('摄像头需要 HTTPS 网址');
      }
      if(
        !navigator.mediaDevices||
        !navigator.mediaDevices.getUserMedia
      ){
        throw new Error('当前浏览器无法调用摄像头，请更新浏览器');
      }
      if(!globalThis.WebAssembly){
        throw new Error('当前浏览器缺少识别引擎支持，请更新浏览器');
      }

      const acquired=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:front?'user':'environment'},
          width:{ideal:640},
          height:{ideal:480}
        },
        audio:false
      });

      if(id!==epoch){
        acquired.getTracks().forEach(track=>track.stop());
        return;
      }

      stream=acquired;
      video.srcObject=stream;
      $('preview').hidden=false;
      video.style.transform=
        overlay.style.transform=
        front?'scaleX(-1)':'none';

      await waitVideo();
      if(id!==epoch)return;

      if(!engine){
        const created=await createEngine(abort.signal);
        if(id!==epoch){
          created.close();
          return;
        }
        engine=created;
      }
      if(id!==epoch)return;

      active=true;
      starting=false;
      lastSeen=performance.now();
      lastInfer=0;
      lastVideo=-1;
      frames=0;
      hits=0;

      $('camera').textContent='关闭摄像头';
      $('flip').disabled=false;
      $('calibration').hidden=false;
      $('diagnostic').textContent='V5 · 正在等待视频帧';

      status(
        '先张掌，完整放入预览画面；看到绿色骨骼线后再慢慢握拳。',
        2200
      );
    }catch(error){
      if(id!==epoch)return;
      let message=error.message;
      if(error.name==='NotAllowedError'){
        message='摄像头权限未获允许，请检查浏览器和系统的相机权限';
      }
      if(error.name==='NotFoundError'){
        message='没有找到可用摄像头';
      }
      if(error.name==='NotReadableError'){
        message='摄像头可能被其他应用占用，请关闭其他应用后重试';
      }
      if(error.name==='AbortError'){
        message='模型下载已中断或超时，请检查网络后重试';
      }
      stopCamera(
        '启动失败：'+message+'。仍可使用手动滑杆。'
      );
      $('diagnostic').textContent='V5 · 摄像头识别未启动';
    }finally{
      if(id===epoch){
        starting=false;
        $('flip').disabled=false;
      }
    }
    }  $('camera').onclick=()=>{
    if(active||starting){
      stopCamera('摄像头已关闭 · 可以使用手动滑杆');
    }else{
      startCamera();
    }
  };

  $('flip').onclick=()=>{
    if(starting)return;
    front=!front;
    $('flip').textContent=front?'切换后置':'切换前置';
    if(active){
      stopCamera();
      startCamera();
    }
  };

  $('amount').oninput=event=>{
    manual=Number(event.target.value)/100;
    if(!active)target=manual;
  };

  function openness(p){
    const d=(a,b)=>Math.hypot(
      p[a].x-p[b].x,
      p[a].y-p[b].y,
      p[a].z-p[b].z
    );
    return [5,9,13,17].reduce((sum,i)=>
      sum+d(i,i+3)/Math.max(
        1e-6,
        d(i,i+1)+d(i+1,i+2)+d(i+2,i+3)
      ),0
    )/4;
  }

  function beginCalibration(kind){
    if(!active){
      status('请先开启摄像头。',2500);
      return;
    }
    noticeUntil=0;
    calibration={
      kind,
      start:performance.now(),
      values:[]
    };
  }

  $('opened').onclick=()=>beginCalibration('open');
  $('closed').onclick=()=>beginCalibration('closed');

  function updateCalibration(time,value){
    if(!calibration)return;
    if(value!==null)calibration.values.push(value);

    const remaining=1.6-(time-calibration.start)/1000;
    if(remaining>0){
      status(
        (calibration.kind==='open'?'保持张掌':'保持握拳')+
        ' · 采集中 '+remaining.toFixed(1)+' 秒'
      );
      return;
    }

    const sample=calibration;
    calibration=null;
    if(sample.values.length<4){
      status(
        '有效手部画面不足，请先张掌，让绿色骨骼线出现。',
        4000
      );
      return;
    }

    sample.values.sort((a,b)=>a-b);
    const valueMedian=sample.values[
      Math.floor(sample.values.length/2)
    ];

    if(sample.kind==='open'&&valueMedian>closed+.12){
      opened=valueMedian;
      status('张掌校准完成。',2500);
    }else if(
      sample.kind==='closed'&&valueMedian<opened-.12
    ){
      closed=valueMedian;
      status('握拳校准完成。',2500);
    }else{
      status(
        '本次开合幅度不足，保留原参数；可以直接尝试开合。',
        3500
      );
    }
  }

  function drawBones(){
    bg.clearRect(0,0,overlay.width,overlay.height);
    if(!points)return;

    const paths=[
      [0,1,2,3,4],[0,5,6,7,8],
      [5,9,10,11,12],[9,13,14,15,16],
      [13,17,18,19,20],[0,17]
    ];

    bg.strokeStyle='#b1f3c8';
    bg.lineWidth=2;

    for(const path of paths){
      bg.beginPath();
      path.forEach((index,k)=>{
        const p=points[index];
        if(k){
          bg.lineTo(
            p.x*overlay.width,p.y*overlay.height
          );
        }else{
          bg.moveTo(
            p.x*overlay.width,p.y*overlay.height
          );
        }
      });
      bg.stroke();
    }

    bg.fillStyle='#fff';
    for(const p of points){
      bg.beginPath();
      bg.arc(
        p.x*overlay.width,p.y*overlay.height,
        2.5,0,Math.PI*2
      );
      bg.fill();
    }
  }  function track(time){
    let value=null;
    if(
      video.readyState>=2&&video.videoWidth&&
      video.currentTime!==lastVideo&&
      time-lastInfer>80
    ){
      lastInfer=time;
      lastVideo=video.currentTime;

      const height=Math.max(
        1,
        Math.round(
          384*video.videoHeight/video.videoWidth
        )
      );

      if(input.width!==384||input.height!==height){
        input.width=384;
        input.height=height;
        overlay.width=320;
        overlay.height=Math.round(
          320*video.videoHeight/video.videoWidth
        );
      }

      $('preview').style.aspectRatio=
        video.videoWidth+'/'+video.videoHeight;

      inputCtx.drawImage(
        video,0,0,input.width,input.height
      );

      const result=engine.detectForVideo(input,time);
      frames++;

      const found=result.landmarks&&result.landmarks[0];

      if(found){
        points=found;
        lastSeen=time;
        hits++;
        raw=openness(
          result.worldLandmarks&&result.worldLandmarks[0]||
          found
        );
        value=raw;
        target=clamp(
          (raw-closed)/Math.max(.12,opened-closed)
        );

        if(!calibration){
          status(
            '已识别手部 · '+
            (target<.15?'握拳 / 花苞':
              target>.85?'张掌 / 盛放':
              '粒子花正在绽放')
          );
        }
      }else{
        if(time-lastSeen>450)points=null;
        if(time-lastSeen>1200){
          target=.06;
          if(!calibration){
            status(
              '未检测到手 · 请张掌并完整放入预览框，也可尝试切换镜头'
            );
          }
        }
      }

      $('diagnostic').textContent=
        'V5 · 已处理 '+frames+
        ' 帧 · 检出手 '+hits+' 次';

      drawBones();
    }

    if(time-lastInfer>4500&&!calibration){
      status('摄像头画面没有更新，请关闭后重新开启。');
    }

    updateCalibration(time,value);
  }

  function frame(time){
    const dt=Math.min(
      .05,Math.max(0,(time-previous)/1000)
    );
    previous=time;

    if(active){
      try{
        track(time);
      }catch(error){
        stopCamera(
          '识别中断：'+error.message+
          '。请重新开启，或使用手动滑杆。'
        );
      }
    }

    bloom+=(target-bloom)*(1-Math.exp(-dt*8));
    $('percent').textContent=
      Math.round(bloom*100)+'%';

    if(active){
      $('amount').value=Math.round(bloom*100);
    }

    if(time-lastPaint>32){
      lastPaint=time;
      g.clearRect(0,0,W,H);

      for(const p of particles){
        p.y-=p.v*dt*(.3+bloom);
        if(p.y<0)p.y=1;
        g.globalAlpha=.18+bloom*.3;
        g.fillStyle='#dcc4ff';
        g.beginPath();
        g.arc(
          p.x*W+Math.sin(time*.0004+p.x*9)*12,
          p.y*H,p.s,0,Math.PI*2
        );
        g.fill();
      }

      g.globalAlpha=1;
      drawFlower(time);
    }

    requestAnimationFrame(frame);
  }

  addEventListener('pagehide',()=>stopCamera());
  addEventListener('pageshow',()=>{
    if(active)video.play().catch(()=>{});
  });

  requestAnimationFrame(frame);
})();
</script>
